<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Profile - FreelanceHub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">FreelanceHub</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="freelancers.html">Find Freelancers</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Find Projects</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-links"></ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div id="profile-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">Loading profile...</p>
            </div>
        </div>
    </div>

    </div>

    <!-- Hire Modal -->
    <div class="modal fade" id="hireModal" tabindex="-1" aria-labelledby="hireModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="hireForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="hireModalLabel">Send Project Offer</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Project Title</label>
                            <input type="text" class="form-control" id="offerTitle" required placeholder="e.g. Need a React Native App">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Project Description</label>
                            <textarea class="form-control" id="offerDescription" rows="4" required placeholder="Describe the scope of work..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Budget (?)</label>
                                <input type="number" class="form-control" id="offerBudget" required placeholder="500">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="offerStartDate" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Deadline</label>
                                <input type="date" class="form-control" id="offerDeadline" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="submit-offer-btn">Send Offer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const container = document.getElementById('profile-container');

            if (!id) {
                container.innerHTML = '<div class="alert alert-danger">Freelancer ID is missing.</div>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/freelancers/${id}`);
                if (!response.ok) throw new Error('Freelancer not found or API error.');
                const freelancer = await response.json();

                const skillsHTML = freelancer.skills && freelancer.skills.length > 0 
                    ? freelancer.skills.map(s => `<span class="badge bg-primary me-2 mb-2 p-2">${s}</span>`).join('') 
                    : '<p class="text-muted">No skills listed.</p>';
                    
                const ratingStr = freelancer.rating && parseFloat(freelancer.rating) > 0 
                    ? `⭐ ${parseFloat(freelancer.rating).toFixed(1)} / 5.0`
                    : '<span class="text-muted">No ratings yet</span>';

                container.innerHTML = `
                    <div class="row">
                        <!-- Left sidebar -->
                        <div class="col-md-4 mb-4">
                            <div class="card border-0 shadow-sm text-center p-4">
                                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 120px; height: 120px; font-size: 3rem;">
                                    ${freelancer.name.charAt(0).toUpperCase()}
                                </div>
                                <h3 class="fw-bold mb-1">${freelancer.name}</h3>
                                <p class="text-primary mb-3">${freelancer.professional_title || 'Professional Freelancer'}</p>
                                <div class="mb-3 fs-5">${ratingStr}</div>
                                <ul class="list-unstyled text-start mb-4">
                                    <li class="mb-2"><i class="bi bi-currency-dollar text-muted me-2"></i><strong>₹${freelancer.hourly_rate || 0}/hr</strong></li>
                                    <li class="mb-2"><i class="bi bi-briefcase text-muted me-2"></i>${freelancer.experience || 'Not specified'}</li>
                                    <li class="mb-2"><i class="bi bi-clock text-muted me-2"></i>${freelancer.availability || 'Not specified'}</li>
                                    <li class="mb-2"><i class="bi bi-geo-alt text-muted me-2"></i>${freelancer.location || 'Remote'}</li>
                                </ul>
                                <button class="btn btn-primary w-100 py-2" id="hire-btn" data-bs-toggle="modal" data-bs-target="#hireModal">Hire / Send Project Offer</button>
                            </div>
                        </div>
                        
                        <!-- Right content -->
                        <div class="col-md-8">
                            <div class="card border-0 shadow-sm p-4 mb-4">
                                <h4 class="fw-bold mb-3">About Me</h4>
                                <p style="white-space: pre-wrap;" class="text-muted">${freelancer.bio || 'This freelancer hasn\'t provided a bio yet.'}</p>
                            </div>
                            
                            <div class="card border-0 shadow-sm p-4 mb-4">
                                <h4 class="fw-bold mb-3">Skills</h4>
                                <div>${skillsHTML}</div>
                            </div>
                        </div>
                    </div>
                `;

                // Handle Hire Button Visibility (hide if the viewer is not a client or not logged in)
                const user = JSON.parse(localStorage.getItem('user'));
                const hireBtn = document.getElementById('hire-btn');
                if (user && user.role === 'freelancer' && user.id == id) {
                    if (hireBtn) {
                        hireBtn.textContent = 'Edit Profile (Coming Soon)';
                        hireBtn.classList.replace('btn-primary', 'btn-outline-primary');
                        hireBtn.removeAttribute('data-bs-toggle');
                        hireBtn.removeAttribute('data-bs-target');
                        hireBtn.addEventListener('click', () => {
                            alert('Edit Profile functionality will be implemented in the next phase.');
                        });
                    }
                } else if (!user || user.role !== 'client') {
                    if (hireBtn) {
                        hireBtn.textContent = 'Login as Client to Hire';
                        hireBtn.classList.replace('btn-primary', 'btn-secondary');
                        hireBtn.removeAttribute('data-bs-toggle');
                        hireBtn.removeAttribute('data-bs-target');
                        hireBtn.addEventListener('click', () => {
                            window.location.href = 'login.html';
                        });
                    }
                }
            } catch (error) {
                container.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        });
        });

        // Form Submit Handler
        document.getElementById('hireForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const freelancer_id = urlParams.get('id');
            const submitBtn = document.getElementById('submit-offer-btn');
            
            const offerData = {
                freelancer_id: freelancer_id,
                project_title: document.getElementById('offerTitle').value,
                description: document.getElementById('offerDescription').value,
                budget: document.getElementById('offerBudget').value,
                start_date: document.getElementById('offerStartDate').value,
                deadline: document.getElementById('offerDeadline').value
            };

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
                
                const response = await fetchAPI('/contracts/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(offerData)
                });
                
                // Close modal
                const modalEl = document.getElementById('hireModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
                
                // Show success
                document.getElementById('profile-container').insertAdjacentHTML('afterbegin', `
                    <div class="alert alert-success alert-dismissible fade show">
                        Offer sent successfully! The freelancer will be notified.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `);
                document.getElementById('hireForm').reset();
            } catch (error) {
                alert('Error sending offer: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Offer';
            }
        });
    </script>
</body>
</html>
