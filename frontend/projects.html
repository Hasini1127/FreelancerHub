<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Projects - FreelanceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">FreelanceHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="freelancers.html">Find Freelancers</a></li>
                    <li class="nav-item"><a class="nav-link active" href="projects.html">Find Projects</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-links">
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <h2 class="mb-4">Browse Projects</h2>
        <div class="row">
            <!-- Filter Sidebar -->
            <div class="col-md-3 mb-4">
                <div class="card p-3 shadow-sm border-0">
                    <h5 class="mb-3 fw-bold">Filters</h5>
                    <form id="filter-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Search (Keyword/Skill)</label>
                            <input type="text" class="form-control" id="search-filter" placeholder="Keywords...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select class="form-select" id="category-filter">
                                <option value="">All Categories</option>
                                <option value="Web Development">Web Development</option>
                                <option value="AI and Machine Learning">AI & Machine Learning</option>
                                <option value="Data Analytics">Data Analytics</option>
                                <option value="UI/UX Design">UI/UX Design</option>
                                <option value="Mobile App Development">Mobile App Dev</option>
                                <option value="Database Development">Database Dev</option>
                                <option value="Graphic Design">Graphic Design</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Experience Level</label>
                            <select class="form-select" id="experience-filter">
                                <option value="">Any Level</option>
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Experienced">Experienced</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="status-filter">
                                <option value="">Any Status</option>
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                        <div class="mb-3 row">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Min (₹)</label>
                                <input type="number" class="form-control" id="min-budget-filter" placeholder="Min">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Max (₹)</label>
                                <input type="number" class="form-control" id="max-budget-filter" placeholder="Max">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Sort By</label>
                            <select class="form-select" id="sort-filter">
                                <option value="newest">Newest First</option>
                                <option value="budget_desc">Highest Budget</option>
                                <option value="budget_asc">Lowest Budget</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-secondary w-50" id="clear-filters">Clear</button>
                            <button type="button" class="btn btn-primary w-50" id="apply-filters">Apply</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Project List -->
            <div class="col-md-9">
                <div id="projects-container">
                    <div class="text-center py-5">Loading projects...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const projectsContainer = document.getElementById('projects-container');
            const categoryFilter = document.getElementById('category-filter');
            let allProjects = [];

            const renderProjects = (projects) => {
                if (projects.length === 0) {
                    projectsContainer.innerHTML = '<div class="alert alert-info">No projects found.</div>';
                    return;
                }

                projectsContainer.innerHTML = projects.map(project => `
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h4 class="card-title">${project.title}</h4>
                                    <h6 class="card-subtitle mb-2 text-muted">Posted by ${project.client_name} - ${new Date(project.created_at).toLocaleDateString()}</h6>
                                </div>
                                <span class="badge badge-status-${project.status.replace(/\s+/g, '')}">${project.status}</span>
                            </div>
                            <p class="card-text mt-3">${project.description.substring(0, 150)}...</p>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <div>
                                    <span class="badge bg-secondary me-2">${project.category}</span>
                                    <strong>₹${project.budget}</strong>
                                </div>
                                <a href="project-details.html?id=${project.id}" class="btn btn-primary btn-sm">View Details</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            };

            try {
                allProjects = await ProjectService.getAllProjects();
                renderProjects(allProjects);
            } catch (error) {
                projectsContainer.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }

            document.getElementById('apply-filters').addEventListener('click', filterProjects);
            document.getElementById('clear-filters').addEventListener('click', () => {
                document.getElementById('search-filter').value = "";
                document.getElementById('category-filter').value = "";
                document.getElementById('experience-filter').value = "";
                document.getElementById('status-filter').value = "";
                document.getElementById('min-budget-filter').value = "";
                document.getElementById('max-budget-filter').value = "";
                document.getElementById('sort-filter').value = "newest";
                filterProjects();
            });

            function filterProjects() {
                const search = document.getElementById('search-filter').value.toLowerCase().trim();
                const category = document.getElementById('category-filter').value;
                const experience = document.getElementById('experience-filter').value;
                const status = document.getElementById('status-filter').value;
                const minBudget = document.getElementById('min-budget-filter').value;
                const maxBudget = document.getElementById('max-budget-filter').value;
                const sortBy = document.getElementById('sort-filter').value;

                let filtered = allProjects.filter(p => {
                    const matchSearch = !search || p.title.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
                    const matchCategory = !category || p.category === category;
                    const matchExp = !experience || p.experience_level === experience;
                    const matchStatus = !status || p.status === status;
                    
                    const budget = parseFloat(p.budget);
                    const matchMinBudget = !minBudget || budget >= parseFloat(minBudget);
                    const matchMaxBudget = !maxBudget || budget <= parseFloat(maxBudget);
                    
                    return matchSearch && matchCategory && matchExp && matchStatus && matchMinBudget && matchMaxBudget;
                });
                
                if (sortBy === 'newest') {
                    filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                } else if (sortBy === 'budget_desc') {
                    filtered.sort((a, b) => parseFloat(b.budget) - parseFloat(a.budget));
                } else if (sortBy === 'budget_asc') {
                    filtered.sort((a, b) => parseFloat(a.budget) - parseFloat(b.budget));
                }
                
                renderProjects(filtered);
            }
        });
    </script>
</body>
</html>
